  <!-- Keys (Row 2) -->
  <circle cx="6" cy="12.5" r="0.75" fill="currentColor" stroke="none" />
  <circle cx="10" cy="12.5" r="0.75" fill="currentColor" stroke="none" />
  <circle cx="14" cy="12.5" r="0.75" fill="currentColor" stroke="none" />
  <circle cx="18" cy="12.5" r="0.75" fill="currentColor" stroke="none" />
